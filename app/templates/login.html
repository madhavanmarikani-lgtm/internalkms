<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - {{ global_app_title or 'AI Key Manager' }}</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">

  <style>
    body.login-canvas {
      background: radial-gradient(circle at top right, #1E2F54 0%, #14213D 55%, #0B1324 100%);
      min-height: 100vh;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 430px;
      width: 100%;
    }
    .login-brand-badge {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }
  </style>
</head>
<body class="login-canvas d-flex align-items-center justify-content-center p-3">
  <div class="login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="login-brand-badge mb-3">
        <i data-lucide="shield-check" style="width: 26px; height: 26px;"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.02em;">{{ global_app_title or 'AI Key Manager' }}</h4>
      <p class="text-muted small mb-0">Enterprise AI Credential Governance</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show py-2 small border-0" role="alert" style="border-radius: 8px;">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="usernameInput" class="form-label small fw-semibold text-dark">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i data-lucide="user"></i></span>
          <input type="text" class="form-control border-start-0 ps-1" id="usernameInput" name="username" value="{{ username or '' }}" required autofocus placeholder="Enter username or email">
        </div>
      </div>

      <div class="mb-3">
        <label for="passwordInput" class="form-label small fw-semibold text-dark">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i data-lucide="lock"></i></span>
          <input type="password" class="form-control border-start-0 border-end-0 ps-1" id="passwordInput" name="password" required placeholder="••••••••">
          <button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <i data-lucide="eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" name="remember" checked>
          <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
        </div>
        <span class="badge badge-soft-slate small d-inline-flex align-items-center gap-1">
          <i data-lucide="shield" style="width: 12px; height: 12px;"></i>RBAC Protected
        </span>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
        <i data-lucide="log-in"></i>
        <span>Sign In to Dashboard</span>
      </button>
    </form>

    <div class="mt-4 pt-3 border-top">
      <div class="small fw-medium text-muted mb-2 text-center">Quick Demo Access</div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-light border btn-sm flex-fill fw-medium d-flex align-items-center justify-content-center gap-1" onclick="fillCreds('admin', 'Admin@12345')">
          <i data-lucide="shield-alert" class="text-primary" style="width: 14px; height: 14px;"></i>
          <span>Admin</span>
        </button>
        <button type="button" class="btn btn-light border btn-sm flex-fill fw-medium d-flex align-items-center justify-content-center gap-1" onclick="fillCreds('viewer', 'Viewer@12345')">
          <i data-lucide="eye" class="text-secondary" style="width: 14px; height: 14px;"></i>
          <span>Viewer</span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    lucide.createIcons();

    function fillCreds(u, p) {
      document.getElementById('usernameInput').value = u;
      document.getElementById('passwordInput').value = p;
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const btn = document.getElementById('togglePasswordBtn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye"></i>';
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
